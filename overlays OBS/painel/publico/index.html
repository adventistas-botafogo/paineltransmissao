<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel — Adventistas Botafogo</title>
<link rel="stylesheet" href="painel.css">
</head>
<body>
  <!-- ícones (usados com <svg><use href="#i-…"/></svg>) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-olho" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></symbol>
    <symbol id="i-lapis" viewBox="0 0 24 24"><path fill="currentColor" d="M3 17.2V21h3.8l11-11-3.8-3.8-11 11ZM20.7 7a1 1 0 0 0 0-1.4l-2.3-2.3a1 1 0 0 0-1.4 0l-1.8 1.8 3.8 3.8L20.7 7Z"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-nome" viewBox="0 0 24 24"><rect x="2" y="13" width="3" height="8" fill="currentColor"/><rect x="6" y="13" width="16" height="5" fill="currentColor"/><rect x="6" y="18.5" width="10" height="2.5" fill="currentColor" opacity=".6"/></symbol>
    <symbol id="i-qr" viewBox="0 0 24 24"><path fill="currentColor" d="M3 3h8v8H3V3Zm2 2v4h4V5H5Zm8-2h8v8h-8V3Zm2 2v4h4V5h-4ZM3 13h8v8H3v-8Zm2 2v4h4v-4H5Zm8-2h3v3h-3v-3Zm3 3h3v3h-3v-3Zm-3 3h3v2h-3v-2Zm6-6h2v3h-2v-3Zm0 6h2v2h-2v-2Z"/></symbol>
    <symbol id="i-sino" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a6 6 0 0 0-6 6v4.5L4 16v1h16v-1l-2-3.5V8a6 6 0 0 0-6-6Zm-2.5 17a2.5 2.5 0 0 0 5 0h-5Z"/></symbol>
    <symbol id="i-logo" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="5" y="7" width="6" height="4" fill="currentColor"/></symbol>
  </svg>

  <header class="topo">
    <div class="marca-topo">
      <img class="logo" src="logo-branca.svg" alt="Adventistas Botafogo">
      <span class="versao" id="versao"></span>
    </div>
    <div class="status">
      <span class="pilula" id="stServidor" title="Servidor do painel"><i></i>Painel</span>
      <span class="pilula" id="stObs" title="Conexão com o OBS"><i></i>OBS</span>
      <span class="pilula" id="stFonte"><i></i>Cena</span>
      <button class="btn-mini" id="btnInstalar" hidden>Instalar no OBS</button>
      <button class="btn btn-panico" id="btnTudo" title="Tira nome, QR e chamada da tela (o logo fica)">Esconder tudo</button>
    </div>
  </header>

  <div class="aviso" id="aviso" hidden></div>

  <div class="app">
    <!-- ================= monitor ================= -->
    <aside class="monitor" aria-label="Monitor">
      <section class="tela-bloco">
        <div class="tela-cab">
          <span class="selo selo-previa">Prévia</span>
          <span class="tela-titulo" id="pvTitulo">—</span>
        </div>
        <div class="tela" id="telaPrevia">
          <iframe id="pvLt"   src="/overlay/lower-third.html?previa=1" title="Prévia do nome" tabindex="-1"></iframe>
          <iframe id="pvQr"   src="/overlay/qrcode.html?previa=1" title="Prévia do QR code" tabindex="-1"></iframe>
          <iframe id="pvEng"  src="/overlay/engajamento.html?previa=1" title="Prévia da chamada" tabindex="-1"></iframe>
          <iframe id="pvLogo" src="/overlay/logo.html?previa=1" title="Prévia do logo" tabindex="-1"></iframe>
        </div>
        <div class="tela-acoes">
          <button type="button" class="btn btn-sec" id="pvAnimar" disabled><svg class="ic"><use href="#i-play"/></svg>Animação</button>
          <button type="button" class="btn btn-noar" id="pvNoAr" disabled>Mandar pro ar</button>
        </div>
      </section>

      <section class="tela-bloco">
        <div class="tela-cab">
          <span class="selo selo-noar">No ar</span>
          <span class="tela-titulo" id="noArTitulo">—</span>
        </div>
        <div class="tela" id="telaNoAr">
          <iframe src="/overlay/lower-third.html?controle=1" title="Nome no ar" tabindex="-1"></iframe>
          <iframe src="/overlay/qrcode.html?controle=1" title="QR code no ar" tabindex="-1"></iframe>
          <iframe src="/overlay/engajamento.html?controle=1" title="Chamada no ar" tabindex="-1"></iframe>
          <iframe src="/overlay/logo.html?controle=1" title="Logo no ar" tabindex="-1"></iframe>
        </div>
      </section>
    </aside>

    <!-- ================= controles ================= -->
    <main class="controles">
      <!-- Nome -->
      <section class="cartao" id="cNome" data-abas>
        <div class="cartao-cab">
          <h2><svg class="ic"><use href="#i-nome"/></svg>Nome</h2>
          <div class="estado" id="ltEstado">
            <span class="chip-noar" id="noAr" hidden>● <b id="tempo">0:00</b></span>
            <span class="estado-txt" id="atualNome"></span>
            <button type="button" class="btn-tirar-mini" id="btnTirar" hidden title="Tirar do ar (Esc)">Tirar</button>
          </div>
        </div>
        <nav class="abas" role="tablist">
          <button type="button" class="aba ativa" data-aba="salvos" role="tab">Salvos</button>
          <button type="button" class="aba" data-aba="editar" role="tab" id="abaNomeEditar">Novo</button>
        </nav>
        <div class="paineis">

        <div class="painel-aba ativa" data-painel="salvos">
          <div class="tiles" id="lista"></div>
        </div>

        <div class="painel-aba" data-painel="editar">
          <form id="form" autocomplete="off">
            <div class="dupla">
              <label>Nome
                <input id="nome" maxlength="120" placeholder="Pr. Patrick Duarte" required>
              </label>
              <label>Linha de baixo
                <input id="linha" maxlength="120" placeholder="@adventistasbotafogo">
              </label>
            </div>
            <div class="acoes">
              <button type="button" class="btn btn-sec" id="btnPrever"><svg class="ic"><use href="#i-olho"/></svg>Prévia</button>
              <button type="submit" class="btn btn-noar">Mandar pro ar</button>
              <button type="button" class="btn btn-tirar" id="btnSalvar" title="Guarda só o texto nos salvos">Salvar</button>
            </div>
            <button type="button" class="btn-link perigo" id="btnExcluir" hidden>Excluir dos salvos</button>
          </form>
        </div>
        </div>
        <div class="tempo-bar">
          <span class="rotulo">Tempo na tela</span>
          <div class="segmentos segmentos-largos" id="duracao">
          <label><input type="radio" name="duracao" value="8"><span>8 s</span></label>
          <label><input type="radio" name="duracao" value="12" checked><span>12 s</span></label>
          <label><input type="radio" name="duracao" value="20"><span>20 s</span></label>
          <label><input type="radio" name="duracao" value="30"><span>30 s</span></label>
          <label><input type="radio" name="duracao" value="0"><span title="Fica até tirar">∞</span></label>
          </div>
        </div>
      </section>

      <!-- QR code -->
      <section class="cartao" id="cQr" data-abas>
        <div class="cartao-cab">
          <h2><svg class="ic"><use href="#i-qr"/></svg>QR code</h2>
          <div class="estado">
            <span class="chip-noar" id="qrNoAr" hidden>● <b id="qrTempo">0:00</b></span>
            <span class="estado-txt" id="qrAtualTitulo"></span>
            <button type="button" class="btn-tirar-mini" id="qrTirar" hidden>Tirar</button>
          </div>
        </div>
        <nav class="abas" role="tablist">
          <button type="button" class="aba ativa" data-aba="salvos" role="tab">Salvos</button>
          <button type="button" class="aba" data-aba="editar" role="tab" id="abaQrEditar">Novo</button>
        </nav>
        <div class="paineis">

        <div class="painel-aba ativa" data-painel="salvos">
          <div class="tiles" id="links"></div>
        </div>

        <div class="painel-aba" data-painel="editar">
          <form id="qrForm" autocomplete="off">
            <label>Link
              <input id="qrUrl" maxlength="500" inputmode="url" placeholder="https://…" required>
            </label>
            <div class="dupla">
              <label>Título
                <input id="qrTitulo" maxlength="60" placeholder="Siga no Instagram">
              </label>
              <label>Rodapé
                <input id="qrRodape" maxlength="60" placeholder="Aponte a câmera">
              </label>
            </div>
            <div class="acoes">
              <button type="button" class="btn btn-sec" id="qrPrever"><svg class="ic"><use href="#i-olho"/></svg>Prévia</button>
              <button type="submit" class="btn btn-noar">Mandar pro ar</button>
              <button type="button" class="btn btn-tirar" id="qrSalvar" title="Guarda só o texto nos salvos">Salvar</button>
            </div>
            <button type="button" class="btn-link perigo" id="qrExcluir" hidden>Excluir dos salvos</button>
          </form>
        </div>
        </div>
        <div class="tempo-bar">
          <span class="rotulo">Tempo na tela</span>
          <div class="segmentos segmentos-largos" id="qrDuracao">
          <label><input type="radio" name="qrDuracao" value="15"><span>15 s</span></label>
          <label><input type="radio" name="qrDuracao" value="30" checked><span>30 s</span></label>
          <label><input type="radio" name="qrDuracao" value="60"><span>1 min</span></label>
          <label><input type="radio" name="qrDuracao" value="120"><span>2 min</span></label>
          <label><input type="radio" name="qrDuracao" value="0"><span title="Fica até tirar">∞</span></label>
          </div>
        </div>
      </section>

      <!-- Chamadas -->
      <section class="cartao cartao-largo" id="cEng" data-abas>
        <div class="cartao-cab">
          <h2><svg class="ic"><use href="#i-sino"/></svg>Chamadas</h2>
          <div class="estado">
            <span class="chip-noar" id="engNoAr" hidden>● no ar</span>
            <span class="chip-rod" id="rodChip" hidden></span>
          </div>
        </div>
        <nav class="abas" role="tablist">
          <button type="button" class="aba ativa" data-aba="tocar" role="tab">Tocar</button>
          <button type="button" class="aba" data-aba="rodizio" role="tab">Rodízio</button>
          <button type="button" class="aba" data-aba="textos" role="tab">Editar textos</button>
        </nav>
        <div class="paineis">

        <div class="painel-aba ativa" data-painel="tocar">
          <div class="tiles tiles-chamadas" id="chamadas"></div>
        </div>

        <div class="painel-aba" data-painel="rodizio">
          <div class="rodizio">
            <label class="chave">
              <input type="checkbox" id="rodAtivo">
              <span class="chave-trilho"></span>
              <span>Automático</span>
            </label>
            <div class="segmentos" id="rodMinutos">
              <label><input type="radio" name="rodMinutos" value="5"><span>5 min</span></label>
              <label><input type="radio" name="rodMinutos" value="10"><span>10 min</span></label>
              <label><input type="radio" name="rodMinutos" value="15"><span>15 min</span></label>
              <label><input type="radio" name="rodMinutos" value="20"><span>20 min</span></label>
              <label><input type="radio" name="rodMinutos" value="30"><span>30 min</span></label>
            </div>
          </div>
          <div class="rod-ids" id="rodIds"></div>
          <p class="rod-proxima" id="rodProxima"></p>
        </div>

        <div class="painel-aba" data-painel="textos">
          <div id="engTextos"></div>
        </div>
        </div>
      </section>

      <!-- Logo -->
      <section class="cartao cartao-linha" id="cLogo">
        <h2><svg class="ic"><use href="#i-logo"/></svg>Logo</h2>
        <div class="segmentos" id="logoVersao" title="Escolher mostra na prévia"></div>
        <span class="chip-noar" id="logoNoAr" hidden>● no ar</span>
        <button type="button" class="btn" id="logoBotao">Tirar logo</button>
      </section>
    </main>
  </div>

<script src="painel.js"></script>
</body>
</html>
